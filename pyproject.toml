[build-system]
requires = ["setuptools >= 65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "franklin-educator"
version = '0.3.142'
classifiers = [
  "Development Status :: 5 - Beta",
  "Intended Audience :: Education",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">= 3.9"
dependencies = [
    'franklin>=0.24.165',  # Core dependency
    # Plugin-specific dependencies only
]
authors = [
  {name = "Kasper Munch", email = "kaspermunch@birc.au.dk"},
]
maintainers = [
  {name = "Kasper Munch", email = "kaspermunch@birc.au.dk"},
]
description = "Educator plugin for Franklin - adds exercise management commands"
keywords = ["teaching", "jupyter", "docker", "gitlab"]
readme = "README.md"
# license = "MIT"

[project.urls]
Homepage = "https://munch-group.org/franklin-educator"
Documentation = "https://munch-group.org/franklin"
Repository = "https://github.com/munch-group/franklin-educator.git"
Issues = "https://github.com/munch-group/franklin-educator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."franklin.plugins"]
# admin = "franklin_educator.users:admin"
exercise = "franklin_educator.git:exercise"


# [project.entry-points."franklin.plugins"]
# create = "franklin_educator.git:create_exercise"
# edit = "franklin_educator.git:edit_cycle"

# [project.entry-points."franklin..plugins"]
# git = "franklin_educator.git:git"

# [project.entry-points."franklin.manage.plugins"]
# create = "franklin_educator.git:create_exercise"

# [project.entry-points."franklin.howto.plugins"]
# docker = "franklin_educator.howto:docker"

[tool.setuptools.package-data]
franklin_educator = [
  "data/*.yaml",
  "data/gitui/*",
  "data/admin/*.enc", 
  ]


[tool.pixi.workspace]
channels = ["conda-forge", "munch-group"]
platforms = ["osx-arm64", "win-64", "osx-64", "linux-64"]

[tool.pixi.target.osx-arm64.dependencies]
setuptools = "*"

